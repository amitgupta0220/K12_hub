[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k12-data-reliability-hub"
version = "0.1.0"
description = "A local-first K-12 data infrastructure portfolio project."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.14,<2.0",
    "eval-type-backport>=0.2,<1.0",
    "minio>=7.2,<8.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.7,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "typing-extensions>=4.12,<5.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.5,<1.0",
    "types-openpyxl>=3.1,<4.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=k12hub --cov-report=term-missing"
markers = [
    "integration: requires running local infrastructure",
    "migration: creates a temporary PostgreSQL database and runs Alembic migrations",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["k12hub"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src", "tests", "scripts"]
