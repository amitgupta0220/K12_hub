name: k12hub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-k12hub}
      POSTGRES_USER: ${POSTGRES_USER:-k12hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k12hub_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-k12hub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_only_change_me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-k12hub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_only_change_me}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-k12-raw}
      MINIO_STANDARDIZED_BUCKET: ${MINIO_STANDARDIZED_BUCKET:-k12-standardized}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-k12-quarantine}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_RAW_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_STANDARDIZED_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_QUARANTINE_BUCKET}"

volumes:
  postgres_data:
  minio_data:
