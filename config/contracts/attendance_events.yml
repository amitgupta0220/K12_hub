source_name: attendance_events
source_system: simulated_attendance
description: Synthetic daily student attendance export.
file_pattern: "attendance_events_*.jsonl"
file_format: jsonl
expected_fields:
  - name: student_id
    data_type: string
    sensitive_classification: direct_identifier
  - name: school_id
    data_type: string
    sensitive_classification: quasi_identifier
  - name: instructional_date
    data_type: date
    sensitive_classification: quasi_identifier
  - name: attendance_status
    data_type: string
    accepted_values:
      - present
      - absent_excused
      - absent_unexcused
      - tardy
    sensitive_classification: sensitive
  - name: minutes_attended
    data_type: integer
    sensitive_classification: sensitive
  - name: reason_code
    data_type: string
    accepted_values:
      - illness
      - appointment
      - transportation
      - family
      - unknown
      - not_applicable
    sensitive_classification: sensitive
  - name: recorded_at
    data_type: datetime
    sensitive_classification: operational
required_fields:
  - student_id
  - school_id
  - instructional_date
  - attendance_status
  - minutes_attended
  - recorded_at
natural_key:
  - student_id
  - school_id
  - instructional_date
expected_grain: one row per student per instructional day
schema_version: "1.0.0"
destination_staging_table: staging.attendance_events
